<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: rgb(43, 42, 42);
            font-family: sans-serif;
            padding: 10px;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        figure img {
            height: 100px;
            width: 100px;
            border-radius: 50px;
            border: 3px whitesmoke solid;
        }
        main {
            background-color: whitesmoke;
            border: none;
            border-radius: 10px;
            padding: 20px;
            max-width: 350px;
            margin: 20px;
        }
        .container {
            text-align: left;
            margin: 10px;
            padding: 10px;
        }
        input {
            margin: 10px;
            padding: 5px;
            border: solid black 2px;
            border-radius: 10px;
        }
        #imgBox {
            width: 200px;
            max-height: 0;
            overflow: hidden;
            padding: 5px;
            border-radius: 5px;
            transition: max-height 1s;
        }
        #imgBox.show-hidden {
            max-height: 300px;
            margin: 10px auto;
            border: 1px solid black;
        }
        button {
            background-color: purple;
            color: white;
            border-radius: 8px;
            border: none;
            padding: 10px;
        }
        #imgBox img {
            width: 100%;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <figure>
            <img src="" alt="">
        </figure>
    </header>
    <main>
        <h1>QR Code Generator</h1>
        <div class="container">
            <p>Input URL or Text</p>
            <input type="text" placeholder="Enter URL or text" id="input">
            <div id="imgBox">
                <img src="" id="qrImage">
            </div>
            <button onclick="generateQR()">Generate</button>
        </div>
    </main>
    <footer>
        <p>All Rights Reserved©</p>
        <p>Contact dev @ <i class="fa-envelope">osakioyaaika1@gmail.com</i> or <i class="fa-phone">07015169036</i></p>
    </footer>
    <script>
        function generateQR() {
            const qrImage = document.getElementById("qrImage");
            let input = document.getElementById("input");
            let imgBox = document.getElementById("imgBox");

            if(input.value.length > 0) {
                qrImage.src = "https://quickchart.io/qr?text=" + input.value + "&size=200";
                
                imgBox.classList.add("show-hidden");
            }
        };
    </script>
</body>
</html>
